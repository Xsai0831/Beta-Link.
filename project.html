<style>
  html,body { height:100%; }
  body { font-family:'Inter','Noto Sans JP',system-ui,sans-serif; background:#0A0A0A; color:#E4E4E7; -webkit-font-smoothing:antialiased; }
  .grad-text { background:linear-gradient(135deg,#00D4FF 0%,#A855F7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .grad-bg   { background:linear-gradient(135deg,#00D4FF 0%,#A855F7 100%); }
  .glass { background:rgba(15,15,16,.7); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
  .glow  { box-shadow:0 0 40px -10px rgba(0,212,255,.35),0 0 80px -20px rgba(168,85,247,.25); }
  .grad-border::before {
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg,rgba(0,212,255,.35),rgba(168,85,247,.35));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }
  .tag-ios     { background:rgba(0,212,255,.08);  color:#67e8f9; border:1px solid rgba(0,212,255,.2); }
  .tag-android { background:rgba(52,211,153,.08); color:#6ee7b7; border:1px solid rgba(52,211,153,.2); }
  .tag-web     { background:rgba(168,85,247,.08); color:#c084fc; border:1px solid rgba(168,85,247,.2); }
  .tag-ai      { background:rgba(251,146,60,.08);  color:#fca86e; border:1px solid rgba(251,146,60,.2); }
  .tag-saas    { background:rgba(250,204,21,.08);  color:#facc15; border:1px solid rgba(250,204,21,.2); }
  #bottomNav   { padding-bottom:env(safe-area-inset-bottom,0px); }
  #msgList     { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.1) transparent; }
  #msgList::-webkit-scrollbar { width:4px; }

  .msg-input:focus { border-color:rgba(0,212,255,.4); }
  .msg-input::placeholder { color:#52525b; }

<script src="auth.js"></script>
<script>
lucide.createIcons();

const TAG_COLORS = {
  iOS:'tag-ios', Android:'tag-android', Web:'tag-web',
  AI:'tag-ai', SaaS:'tag-saas', ゲーム:'tag-saas', デザイン:'tag-saas', その他:'tag-saas'
};

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(d) {
  const diff = Date.now() - new Date(d);
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), day = Math.floor(diff/86400000);
  if (m < 1) return 'たった今';
  if (m < 60) return `${m}分前`;
  if (h < 24) return `${h}時間前`;
  if (day === 1) return '昨日';
  return `${day}日前`;
}

let project = null;
let mySession = null;
let isOwner = false;
const sentMsgIds = new Set();

function renderMessage(msg, scroll = true) {
  const listEl = document.getElementById('msgList');
  const emptyEl = document.getElementById('msgEmpty');
  if (emptyEl) emptyEl.remove();

  const isMine = msg.user_id === mySession?.user?.id;
  const isProjectOwner = project && msg.user_id === project.user_id;

  const div = document.createElement('div');
  div.className = 'flex gap-3 items-start';
  div.innerHTML = `
    <img src="${esc(msg.avatar_url) || `https://api.dicebear.com/7.x/initials/svg?seed=${esc(msg.username)}`}"
      class="w-8 h-8 rounded-full flex-shrink-0 bg-zinc-800 object-cover" alt="" />
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5 mb-1 flex-wrap">
        <span class="text-xs font-semibold ${isMine ? 'text-cyan-300' : 'text-zinc-300'}">@${esc(msg.username)}</span>
        ${isProjectOwner ? '<span class="text-[10px] px-1.5 py-0.5 rounded border border-yellow-400/40 text-yellow-300 bg-yellow-400/10 font-semibold">開発者</span>' : ''}
        ${msg.user_id === ADMIN_ID ? '<span class="text-[10px] px-1.5 py-0.5 rounded border border-yellow-400/40 text-yellow-300 bg-yellow-400/10 font-semibold">管理者</span>' : ''}
        <span class="text-[11px] text-zinc-600">${timeAgo(msg.created_at)}</span>
      </div>
      <p class="text-sm text-zinc-300 leading-relaxed break-words">${esc(msg.content)}</p>
    </div>`;
  listEl.appendChild(div);
  if (scroll) listEl.scrollTop = listEl.scrollHeight;
}

async function loadFeedback(projectId) {
  const { data } = await sb.from('test_history')
    .select('feedback, created_at')
    .eq('project_id', projectId)
    .not('feedback', 'is', null)
    .neq('feedback', '')
    .order('created_at', { ascending: false });

  if (!data?.length) return;

  document.getElementById('feedbackCount').textContent = `${data.length}件`;
  document.getElementById('feedbackList').innerHTML = data.map(f => `
    <div class="flex gap-3 pb-4 border-b border-white/5 last:border-0 last:pb-0">
      <div class="w-7 h-7 rounded-full bg-white/8 flex items-center justify-center flex-shrink-0 mt-0.5">
        <i data-lucide="message-square" class="w-3.5 h-3.5 text-zinc-500"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm text-zinc-300 leading-relaxed mb-1">${esc(f.feedback)}</p>
        <span class="text-xs text-zinc-600">${timeAgo(f.created_at)}</span>
      </div>
    </div>`).join('');

  lucide.createIcons();
  document.getElementById('feedbackSection').classList.remove('hidden');
}

function setupChat(projectId, session) {
  // Load existing messages
  sb.from('messages')
    .select('*')
    .eq('project_id', projectId)
    .order('created_at', { ascending: true })
    .then(({ data }) => {
      (data || []).forEach(m => renderMessage(m, false));
      const list = document.getElementById('msgList');
      list.scrollTop = list.scrollHeight;
    });

  // Realtime subscription
  sb.channel(`chat-${projectId}`)
    .on('postgres_changes', {
      event: 'INSERT', schema: 'public', table: 'messages',
      filter: `project_id=eq.${projectId}`
    }, payload => {
      if (sentMsgIds.has(payload.new.id)) return;
      renderMessage(payload.new, true);
    })
    .subscribe();

  // Send message via RPC (bypasses RLS issues)
  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content) return;

    const u = session.user;
    const username = u.user_metadata?.user_name || u.email?.split('@')[0] || 'user';
    const avatar_url = u.user_metadata?.avatar_url || '';

    input.value = '';
    input.style.height = 'auto';

    const { data, error } = await sb.rpc('send_message', {
      proj_id: projectId,
      msg_content: content,
      msg_username: username,
      msg_avatar: avatar_url
    });

    if (error || data?.error) {
      input.value = content;
      const msg = error?.message || data?.error || '不明なエラー';
      alert('送信エラー: ' + msg);
      return;
    }
    // メッセージはRealtime経由で表示される
  }

  document.getElementById('sendBtn').addEventListener('click', sendMessage);
  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  document.getElementById('msgInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
}

function setupFeedback(projectId, myFeedback) {
  const btn = document.getElementById('feedbackBtn');
  const wrap = document.getElementById('feedbackFormWrap');
  const input = document.getElementById('feedbackInput');
  const charCount = document.getElementById('fbCharCount');
  const alertEl = document.getElementById('fbAlert');

  if (myFeedback) {
    btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> 送信済み';
    btn.disabled = true;
    btn.classList.add('opacity-50');
    lucide.createIcons();
    return;
  }

  btn.addEventListener('click', () => {
    wrap.classList.toggle('hidden');
    if (!wrap.classList.contains('hidden')) input.focus();
    lucide.createIcons();
  });

  document.getElementById('cancelFbBtn').addEventListener('click', () => {
    wrap.classList.add('hidden');
    alertEl.classList.add('hidden');
  });

  input.addEventListener('input', () => { charCount.textContent = input.value.length; });

  document.getElementById('submitFbBtn').addEventListener('click', async () => {
    const text = input.value.trim();
    if (!text) { alertEl.textContent = 'フィードバックを入力してください'; alertEl.classList.remove('hidden'); return; }
    alertEl.classList.add('hidden');

    const submitBtn = document.getElementById('submitFbBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    const { error } = await sb.rpc('submit_feedback', { proj_id: projectId, feedback_text: text });

    if (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
      alertEl.textContent = 'エラー: ' + error.message;
      alertEl.classList.remove('hidden');
      return;
    }

    wrap.classList.add('hidden');
    btn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5"></i> 送信済み';
    btn.disabled = true;
    btn.classList.add('opacity-50');
    lucide.createIcons();
    loadFeedback(projectId);
  });
}

(async function () {
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { show('notFoundEl'); return; }

  mySession = await auth.getSession();
  const myId = mySession?.user?.id;

  const { data: p, error } = await sb.from('projects').select('*').eq('id', id).single();
  if (error || !p) { show('notFoundEl'); return; }

  project = p;
  document.title = `${p.title} — BetaLink`;

  // Tags & badges
  const tagsEl = document.getElementById('tagsEl');
  (p.tags || []).forEach(t => {
    const s = document.createElement('span');
    s.className = `text-[11px] px-2 py-0.5 rounded font-mono ${TAG_COLORS[t] || 'tag-saas'}`;
    s.textContent = t;
    tagsEl.appendChild(s);
  });
  if (p.user_id === ADMIN_ID) {
    const b = document.createElement('span');
    b.className = 'text-[11px] px-2 py-0.5 rounded border border-yellow-400/50 text-yellow-300 bg-yellow-400/10 font-semibold';
    b.textContent = '管理者';
    tagsEl.appendChild(b);
  }

  document.getElementById('titleEl').textContent = p.title;
  document.getElementById('descEl').textContent = p.description || '説明なし';
  document.getElementById('countEl').textContent = `${p.current_count}/${p.target_count} 人参加`;
  document.getElementById('timeEl').textContent = timeAgo(p.created_at);

  if (p.url) {
    document.getElementById('urlBtn').href = p.url;
    document.getElementById('urlBtnWrap').classList.remove('hidden');
  }

  if (p.keywords) {
    const kws = p.keywords.split(/[,、\s]+/).filter(Boolean);
    if (kws.length) {
      const kwWrap = document.getElementById('kwWrap');
      kwWrap.classList.remove('hidden');
      kwWrap.classList.add('flex');
      document.getElementById('kwEl').innerHTML = kws.map(k =>
        `<span class="text-[11px] px-1.5 py-0.5 rounded bg-white/5 text-zinc-500">${esc(k)}</span>`).join('');
    }
  }

  isOwner = myId && p.user_id === myId;
  const isClosed = p.status === 'closed';

  // Check participation
  let isJoined = false;
  let myFeedback = null;
  if (myId && !isOwner) {
    const { data: hist } = await sb.from('test_history')
      .select('id, feedback')
      .eq('tester_id', myId)
      .eq('project_id', id)
      .maybeSingle();
    isJoined = !!hist;
    myFeedback = hist?.feedback || null;
  }

  const canChat = isOwner || isJoined;

  if (canChat) {
    document.getElementById('chatArea').classList.remove('hidden');
    setupChat(id, mySession);
    if (!isOwner) setupFeedback(id, myFeedback);
    else {
      // 開発者はフィードバックボタン不要
      document.getElementById('feedbackBtn').classList.add('hidden');
    }
  } else if (isClosed) {
    document.getElementById('joinArea').classList.remove('hidden');
    document.getElementById('joinContent').innerHTML = `
      <div class="flex items-center gap-2 text-zinc-500 text-sm">
        <i data-lucide="lock" class="w-4 h-4"></i> この募集はクローズしました
      </div>`;
  } else if (!mySession) {
    document.getElementById('joinArea').classList.remove('hidden');
    document.getElementById('joinContent').innerHTML = `
      <p class="text-sm text-zinc-400 mb-4">テストに参加するには GitHub ログインが必要です。</p>
      <a href="login.html" class="inline-flex items-center gap-2 grad-bg text-black font-bold px-6 py-3.5 rounded-xl hover:opacity-90 transition glow text-sm">
        <i data-lucide="github" class="w-4 h-4"></i> ログインして参加する
      </a>`;
  } else {
    document.getElementById('joinArea').classList.remove('hidden');
    document.getElementById('joinContent').innerHTML = `
      <div class="mb-5">
        <p class="font-semibold text-base mb-1">このプロジェクトをテストする</p>
        <p class="text-sm text-zinc-500">参加するとチャットルームに入れます。開発者や他のテスターと話しながら作品を試してみましょう。</p>
      </div>
      ${p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener"
        class="flex items-center justify-between p-4 rounded-xl border border-cyan-400/20 bg-cyan-400/5 hover:bg-cyan-400/8 transition mb-4 group">
        <span class="text-sm font-medium text-cyan-300">先に作品を確認する</span>
        <i data-lucide="external-link" class="w-4 h-4 text-cyan-400"></i>
      </a>` : ''}
      <button id="joinBtn" class="w-full grad-bg text-black font-bold py-3.5 rounded-xl hover:opacity-90 transition glow text-sm flex items-center justify-center gap-2">
        <i data-lucide="rocket" class="w-4 h-4"></i> テストに参加する
      </button>
      <div class="mt-3 flex items-center gap-2 px-4 py-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-sm text-emerald-300">
        <i data-lucide="coins" class="w-4 h-4 flex-shrink-0"></i>
        <span>レビューをして <strong>+3トークン</strong> を獲得</span>
      </div>
      <div id="joinErr" class="hidden mt-3 text-xs text-red-400"></div>`;

    lucide.createIcons();

    document.getElementById('joinBtn').addEventListener('click', async () => {
      const btn = document.getElementById('joinBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="opacity-60">処理中...</span>';

      const { data, error } = await sb.rpc('join_project', { proj_id: id });
      if (error || data?.error) {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="rocket" class="w-4 h-4"></i> テストに参加する';
        lucide.createIcons();
        const errEl = document.getElementById('joinErr');
        errEl.textContent = error?.message || 'エラーが発生しました';
        errEl.classList.remove('hidden');
        return;
      }

      document.getElementById('countEl').textContent = `${p.current_count + 1}/${p.target_count} 人参加`;
      document.getElementById('joinArea').classList.add('hidden');
      document.getElementById('chatArea').classList.remove('hidden');
      setupChat(id, mySession);
      setupFeedback(id, null);
    });
  }

  await loadFeedback(id);
  lucide.createIcons();
  show('contentEl');
})();

function show(id) {
  document.getElementById('loadingEl').classList.add('hidden');
  document.getElementById(id).classList.remove('hidden');
}
</script>
</body>
</html>
