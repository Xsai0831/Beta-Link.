<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter','Noto Sans JP','system-ui','sans-serif'],
          mono: ['JetBrains Mono','monospace']
        },
        colors: {
          ink: { 900:'#0A0A0A', 800:'#0F0F10', 700:'#161618', 600:'#1C1C1F', 500:'#26262B', 400:'#3A3A42' }
        }

</script>
<style>
  html { scroll-behavior:smooth; }
  body { font-family:'Inter','Noto Sans JP',system-ui,sans-serif; background:#0A0A0A; color:#E4E4E7; -webkit-font-smoothing:antialiased; }
  .grad-text { background:linear-gradient(135deg,#00D4FF 0%,#A855F7 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .grad-bg   { background:linear-gradient(135deg,#00D4FF 0%,#A855F7 100%); }
  .grad-border { position:relative; }
  .grad-border::before {
    content:''; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:linear-gradient(135deg,rgba(0,212,255,.5),rgba(168,85,247,.5));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }
  .glass { background:rgba(15,15,16,.6); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .glow  { box-shadow:0 0 40px -10px rgba(0,212,255,.4),0 0 80px -20px rgba(168,85,247,.3); }
  #bottomNav { padding-bottom:env(safe-area-inset-bottom,0px); }
  .tag-ios     { background:rgba(0,212,255,.12); color:#67e8f9; border:1px solid rgba(0,212,255,.25); }
  .tag-android { background:rgba(251,191,36,.1);  color:#fcd34d; border:1px solid rgba(251,191,36,.25); }
  .tag-web     { background:rgba(52,211,153,.12); color:#6ee7b7; border:1px solid rgba(52,211,153,.25); }
  .tag-ai      { background:rgba(168,85,247,.12); color:#d8b4fe; border:1px solid rgba(168,85,247,.25); }
  .tag-saas    { background:rgba(148,163,184,.1); color:#cbd5e1; border:1px solid rgba(148,163,184,.25); }
  .tag-urgent  { background:rgba(244,63,94,.12);  color:#fda4af; border:1px solid rgba(244,63,94,.25); }
  .tag-match   { background:rgba(52,211,153,.12); color:#6ee7b7; border:1px solid rgba(52,211,153,.25); }
  .tag-closed  { background:rgba(113,113,122,.1); color:#a1a1aa; border:1px solid rgba(113,113,122,.25); }
  #bottomSheet { transform:translateY(100%); transition:transform .32s cubic-bezier(.32,0,0,1); }
  #bottomSheet.open { transform:translateY(0); }
  #sheetBackdrop { opacity:0; pointer-events:none; transition:opacity .25s ease; }
  #sheetBackdrop.open { opacity:1; pointer-events:auto; }
  #sheetScroll { scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.1) transparent; }
  #sheetScroll::-webkit-scrollbar { width:4px; }
  #sheetScroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,.1); border-radius:4px; }
</style>
</head>

<!-- Navbar -->
<header class="fixed top-0 inset-x-0 z-50 glass border-b border-white/5">

<!-- Bottom Sheet backdrop -->

<!-- Bottom Sheet -->

  <!-- Handle + close -->
  <div class="flex-shrink-0 pt-3 pb-2 px-5">
    <div class="w-10 h-1 rounded-full bg-white/20 mx-auto mb-3"></div>
    <div class="flex items-start justify-between gap-3">
      <div id="sheetTags" class="flex flex-wrap gap-1.5"></div>
      <button onclick="closeSheet()" class="text-zinc-500 hover:text-zinc-300 transition flex-shrink-0 p-1 -mr-1 -mt-1">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>
  </div>

  <!-- Scrollable body -->
  <div id="sheetScroll" class="overflow-y-auto flex-1 px-5 pb-2">
    <h2 id="sheetTitle" class="text-xl font-bold mb-2 leading-snug"></h2>
    <p id="sheetDesc" class="text-zinc-400 text-sm leading-relaxed mb-4"></p>
    <div id="sheetKwWrap" class="hidden flex-wrap gap-1.5 mb-4"></div>
    <div class="flex flex-wrap items-center gap-4 text-sm text-zinc-500 pb-4 border-b border-white/5">
      <span class="flex items-center gap-1.5">
        <i data-lucide="users" class="w-4 h-4"></i>

      </span>
      <span class="flex items-center gap-1.5">
        <i data-lucide="clock" class="w-4 h-4"></i>
        <span id="sheetTime"></span>
      </span>
      <span id="sheetUrlWrap" class="hidden">
        <a id="sheetUrl" href="#" target="_blank" rel="noopener"
          class="flex items-center gap-1.5 text-cyan-400 hover:text-cyan-300 transition font-medium">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 作品を開く
        </a>
      </span>
    </div>
  </div>

  <!-- CTA -->
  <div class="flex-shrink-0 px-5 py-4 border-t border-white/5" style="padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))">

      class="w-full grad-bg text-black font-bold py-3.5 rounded-xl hover:opacity-90 transition glow text-sm flex items-center justify-center gap-2">

<script src="auth.js"></script>
<script>
lucide.createIcons();
updateNavAuth();

const searchEl  = document.getElementById('boardSearch');
const countLbl  = document.getElementById('countLabel');
const boardList = document.getElementById('boardList');

let rows         = [];
let activeFilter = 'all';
let activeSort   = 'new';
const projectsMap = {};
let mySession = null;
const joinedIds = new Set();

function openSheet(id) {
  const p = projectsMap[id];
  if (!p) return;

  const tagsEl = document.getElementById('sheetTags');
  tagsEl.innerHTML = (p.tags || []).map(t =>
    `<span class="text-[11px] px-2 py-0.5 rounded font-mono ${TAG_COLORS[t] || 'tag-saas'}">${esc(t)}</span>`
  ).join('');
  if (p.user_id === ADMIN_ID) {
    tagsEl.innerHTML += `<span class="text-[10px] px-1.5 py-0.5 rounded border border-yellow-400/50 text-yellow-300 bg-yellow-400/10 font-semibold">管理者</span>`;
  }

  document.getElementById('sheetTitle').textContent = p.title;
  document.getElementById('sheetDesc').textContent = p.description || '説明なし';
  document.getElementById('sheetCount').textContent = `${p.current_count}/${p.target_count} 人参加`;
  document.getElementById('sheetTime').textContent = timeAgo(p.created_at);

  const kwWrap = document.getElementById('sheetKwWrap');
  if (p.keywords) {
    const kws = p.keywords.split(/[,、\s]+/).filter(Boolean);
    if (kws.length) {
      kwWrap.innerHTML = kws.map(k => `<span class="text-[11px] px-1.5 py-0.5 rounded bg-white/5 text-zinc-500">${esc(k)}</span>`).join('');
      kwWrap.classList.remove('hidden');
      kwWrap.classList.add('flex');
    } else { kwWrap.classList.add('hidden'); kwWrap.classList.remove('flex'); }
  } else { kwWrap.classList.add('hidden'); kwWrap.classList.remove('flex'); }

  const urlWrap = document.getElementById('sheetUrlWrap');
  if (p.url) {
    document.getElementById('sheetUrl').href = p.url;
    urlWrap.classList.remove('hidden');
  } else {
    urlWrap.classList.add('hidden');
  }

  const isOwnerSheet = mySession && p.user_id === mySession.user?.id;
  const isJoinedSheet = joinedIds.has(id);
  const btn = document.getElementById('sheetJoinBtn');
  btn.onclick = () => { location.href = `project.html?id=${id}`; };
  if (isOwnerSheet) {
    btn.innerHTML = '<i data-lucide="message-circle" class="w-4 h-4"></i> チャットを管理する';
    btn.className = 'w-full text-black font-bold py-3.5 rounded-xl hover:opacity-90 transition text-sm flex items-center justify-center gap-2 grad-bg glow';
  } else if (isJoinedSheet) {
    btn.innerHTML = '<i data-lucide="message-circle" class="w-4 h-4"></i> チャットを開く';
    btn.className = 'w-full font-bold py-3.5 rounded-xl hover:opacity-90 transition text-sm flex items-center justify-center gap-2 bg-emerald-500/20 text-emerald-300 border border-emerald-400/30';
  } else {
    btn.innerHTML = '<i data-lucide="rocket" class="w-4 h-4"></i> 参加する';
    btn.className = 'w-full grad-bg text-black font-bold py-3.5 rounded-xl hover:opacity-90 transition glow text-sm flex items-center justify-center gap-2';
  }

  document.getElementById('sheetScroll').scrollTop = 0;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
  lucide.createIcons();
}

function closeSheet() {
  document.getElementById('sheetBackdrop').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function applyFilter() {
  const emptyEl = document.getElementById('emptyState');
  const q = searchEl.value.trim().toLowerCase();
  let visible = 0;
  rows.forEach(row => {
    const tags     = row.dataset.tags     || '';
    const keywords = row.dataset.keywords || '';
    const title    = row.querySelector('h2')?.textContent.toLowerCase() || '';
    const desc     = row.querySelector('p.desc')?.textContent.toLowerCase() || '';
    const matchF   = activeFilter === 'all' || tags.includes(activeFilter);
    const matchS   = activeSort !== 'urgent' || row.dataset.urgent === 'true';
    const matchQ   = !q || title.includes(q) || desc.includes(q) || tags.includes(q) || keywords.includes(q);
    const show     = matchF && matchS && matchQ;
    row.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  countLbl.textContent = `${visible}件を表示中`;
  if (emptyEl) emptyEl.classList.toggle('hidden', visible > 0);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('bg-white/10','text-white','border-white/10');
      b.classList.add('text-zinc-500','border-transparent');
    });
    btn.classList.add('bg-white/10','text-white','border-white/10');
    btn.classList.remove('text-zinc-500','border-transparent');
    activeFilter = btn.dataset.filter;
    applyFilter();
  });
});

document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sort-btn').forEach(b => {
      b.classList.remove('bg-white/10','text-white','border-white/10');
      b.classList.add('text-zinc-500','border-transparent');
    });
    btn.classList.add('bg-white/10','text-white','border-white/10');
    btn.classList.remove('text-zinc-500','border-transparent');
    activeSort = btn.dataset.sort;
    applyFilter();
  });
});

searchEl.addEventListener('input', applyFilter);

// ---- タグ色マッピング ----
const TAG_COLORS = {
  iOS:'tag-ios', Android:'tag-android', Web:'tag-web',
  AI:'tag-ai', SaaS:'tag-saas', ゲーム:'tag-saas', デザイン:'tag-saas', その他:'tag-saas'
};

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr);
  const m = Math.floor(diff / 60000);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (m < 1)  return 'たった今';
  if (m < 60) return `${m}分前`;
  if (h < 24) return `${h}時間前`;
  if (d === 1) return '昨日';
  return `${d}日前`;
}

// ---- 実データ読み込み ----
(async function () {
  try {
  mySession       = await auth.getSession();
  const myId     = mySession?.user?.id;
  const postDest = mySession ? 'post.html' : 'login.html';

  ['postBtnHeader','postBtnNavbar','postBtnNav'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.href = postDest;
  });

  // 参加済みプロジェクトIDを取得
  if (myId) {
    const { data: hist } = await sb.from('test_history').select('project_id').eq('tester_id', myId);
    (hist || []).forEach(h => joinedIds.add(h.project_id));
  }

  const { data: projects, error } = await sb
    .from('projects')
    .select('*')
    .eq('status', 'active')
    .order('created_at', { ascending: false });

  if (error || !projects?.length) {
    boardList.innerHTML = `
      <div class="px-5 py-16 text-center">
        <p class="text-zinc-500 text-sm mb-3">現在募集中のプロジェクトはありません</p>
        <a href="${postDest}" class="inline-flex items-center gap-1.5 text-sm grad-text font-medium">
          最初のプロジェクトを投稿する →
        </a>
      </div>
      <div id="emptyState" class="hidden px-5 py-16 text-center">
        <p class="text-zinc-500 text-sm">条件に一致するプロジェクトが見つかりません</p>
      </div>`;
    countLbl.textContent = '0件を表示中';
    return;
  }

  projects.forEach(p => { projectsMap[p.id] = p; });

  boardList.innerHTML = projects.map((p, i) => {
    const isOwn    = myId && p.user_id === myId;
    const tagsHtml = (p.tags || []).map(t =>
      `<span class="text-[10px] px-1.5 py-0.5 rounded font-mono ${TAG_COLORS[t] || 'tag-saas'}">${esc(t)}</span>`
    ).join('');
    const isPostByAdmin = p.user_id === ADMIN_ID;
    const isJoined = !isOwn && joinedIds.has(p.id);
    const ownBadge = isPostByAdmin
      ? `<span class="text-[10px] px-1.5 py-0.5 rounded border border-yellow-400/50 text-yellow-300 bg-yellow-400/10 font-semibold">管理者</span>`
      : isOwn
        ? `<span class="text-[10px] px-1.5 py-0.5 rounded border border-cyan-400/50 text-cyan-300 bg-cyan-400/10 font-semibold">自分の投稿</span>`
        : isJoined
          ? `<span class="text-[10px] px-1.5 py-0.5 rounded border border-emerald-400/50 text-emerald-300 bg-emerald-400/10 font-semibold">参加中</span>`
          : '';
    const editBtn = isOwn
      ? `<a href="post.html?id=${esc(p.id)}" onclick="event.stopPropagation()" class="text-xs text-zinc-400 hover:text-white border border-white/10 hover:border-white/20 px-3 py-1.5 rounded-lg transition flex-shrink-0">編集</a>`
      : '';
    const kwList = p.keywords
      ? p.keywords.split(/[,、\s]+/).filter(Boolean).map(k =>
          `<span class="text-[10px] px-1.5 py-0.5 rounded bg-white/5 text-zinc-500">${esc(k)}</span>`
        ).join('')
      : '';

    return `
      <div class="board-row grid grid-cols-12 gap-3 px-5 py-4 hover:bg-white/[0.03] transition items-start cursor-pointer"
           data-tags="${esc((p.tags || []).join(' ').toLowerCase())}"
           data-urgent="false"
           data-keywords="${esc((p.keywords || '').toLowerCase())}"
           onclick="openSheet('${esc(p.id)}')"
           role="button" tabindex="0">
        <div class="col-span-1 text-zinc-600 font-mono text-xs pt-1 hidden sm:block">#${String(i + 1).padStart(3,'0')}</div>
        <div class="col-span-12 sm:col-span-7">
          <div class="flex items-center gap-1.5 flex-wrap mb-1.5">
            ${tagsHtml}${ownBadge}
          </div>
          <h2 class="font-semibold text-base mb-0.5">${esc(p.title)}</h2>
          ${p.description ? `<p class="desc text-xs text-zinc-500 line-clamp-2">${esc(p.description)}</p>` : ''}
          ${kwList ? `<div class="flex items-center gap-1 mt-1.5 flex-wrap">${kwList}</div>` : ''}
        </div>
        <div class="col-span-12 sm:col-span-4 flex items-center justify-between sm:justify-end gap-3 text-xs text-zinc-500">
          <span class="flex items-center gap-1">
            <i data-lucide="users" class="w-3.5 h-3.5" aria-hidden="true"></i>
            ${p.current_count}/${p.target_count}
          </span>
          <span>${timeAgo(p.created_at)}</span>
          ${editBtn}
        </div>
      </div>`;
  }).join('') + `
    <div id="emptyState" class="hidden px-5 py-16 text-center">
      <i data-lucide="search-x" class="w-10 h-10 text-zinc-600 mx-auto mb-4" aria-hidden="true"></i>
      <p class="text-zinc-500 text-sm">条件に一致するプロジェクトが見つかりません</p>
    </div>`;

  lucide.createIcons();
  rows = Array.from(document.querySelectorAll('.board-row'));
  countLbl.textContent = `${rows.length}件を表示中`;
  } catch(e) {
    boardList.innerHTML = `<div class="px-5 py-12 text-center text-red-400 text-sm">エラー: ${e.message}</div>`;
    countLbl.textContent = '読み込み失敗';
    console.error(e);
  }
})();
</script>
</body>
</html>
